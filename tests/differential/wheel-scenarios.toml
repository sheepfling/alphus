[[scenario.variant]]
name = "plan"
arguments = ["--config", "quality-gates.toml", "--profile", "check", "--plan", "--json"]

[[scenario]]
name = "profile-serial-parallel"
expected_findings = [
  { rule_id = "alphus/any/none/maintainability/code-file-too-large", path = "src/example.py" },
  { rule_id = "alphus/any/none/style/line-too-long", path = "src/example.py", line = 3 },
  { rule_id = "alphus/any/none/style/line-too-long", path = "src/example.py", line = 4 },
]
fixture = "profile"
selectors = ["file-size", "line-length"]
behavior = ["explicit-profile-selection", "severity-priority", "ordered-results", "serial-parallel"]
expected_exit = 0
minimum_findings = 2
expected_step_names = ["source-size", "source-lines"]
expected_step_rules = ["file-size", "line-length"]
require_passed_steps = true
required_output = ["src/example.py", "warning", "high", "normal"]

[[scenario.variant]]
name = "serial"
arguments = ["--config", "quality-gates.toml", "--profile", "check", "--run", "--json", "--jobs", "1"]

[[scenario.variant]]
name = "parallel"
arguments = ["--config", "quality-gates.toml", "--profile", "check", "--run", "--json", "--jobs", "2"]
compare_within_build = true

