schema_version = 1

[files]
include = ["src/**/*.py"]
exclude = []

[checks.provenance_ownership]
extensions = [".py"]
source_paths = ["src/*.py"]
function_names = ["remaining_paragraphs"]
owner_collection_names = ["tables"]
candidate_collection_names = ["paragraphs"]
ownership_basis = "exact-source-span"

[checks.semantic_work_presentation]
extensions = [".py"]
source_paths = ["src/*.py"]
function_names = ["render_document"]
source_layout_helpers = ["reconstruct_layout"]
content_correction_helpers = ["apply_content_correction"]
semantic_ownership_helpers = ["decide_semantic_ownership"]
serialization_helpers = ["serialize_output"]
module_role = "presentation"

[orchestration]
default_profile = "review-architecture"
failure_threshold = "error"

[[orchestration.steps]]
kind = "rule"
name = "Review provenance ownership"
rule = "provenance-as-ownership"

[[orchestration.steps]]
kind = "rule"
name = "Review semantic work in presentation"
rule = "semantic-work-in-presentation"

[[orchestration.profiles]]
name = "review-architecture"
steps = ["Review provenance ownership", "Review semantic work in presentation"]
