schema_version = 1

[files]
include = ["src/**/*.py"]
exclude = []

[checks.suppression_reasons]
extensions = [".py"]
rule_codes = ["E402"]
reason_delimiter = "--"
exclude = []

[orchestration]
default_profile = "suppression-review"
failure_threshold = "error"

[[orchestration.steps]]
kind = "rule"
name = "Suppression reasons"
rule = "suppression-reasons"

[[orchestration.profiles]]
name = "suppression-review"
steps = ["Suppression reasons"]
