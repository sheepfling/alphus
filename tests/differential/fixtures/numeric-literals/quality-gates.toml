schema_version = 1

[files]
include = ["src/**/*.py"]
exclude = []

[checks.numeric_literals]
extensions = [".py"]

[orchestration]
default_profile = "numeric-review"
failure_threshold = "error"

[[orchestration.steps]]
kind = "rule"
name = "numeric-constants"
rule = "numeric-literals"
severity = "warning"
priority = "normal"

[[orchestration.profiles]]
name = "numeric-review"
steps = ["numeric-constants"]
