[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphus-differential-duplicate-plugin"
version = "0.1.0"
requires-python = ">=3.11,<3.16"
dependencies = ["alphus>=0.0.1,<1"]

[project.entry-points."alphus.rules.v1"]
diff = "duplicate_plugin.provider:register"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
