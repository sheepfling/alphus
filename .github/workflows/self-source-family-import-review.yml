name: Alphus source family import self-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Alphus
        run: python -m pip install --disable-pip-version-check -e .
      - name: Review Alphus source families and retain the complete report
        shell: bash
        run: |
          set -o pipefail
          alphus --root . --config .github/alphus-self-source-families.toml \
            --profile self-source-family-imports --output json \
            | tee "$RUNNER_TEMP/alphus-source-family-import-review.json"
      - name: Retain Alphus source family findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alphus-source-family-import-review
          path: ${{ runner.temp }}/alphus-source-family-import-review.json
          if-no-files-found: ignore
          retention-days: 30
