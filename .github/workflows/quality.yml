name: Alphus quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check editable installation
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          alphus --help
      - name: Build and install the wheel
        run: |
          mkdir -p "$RUNNER_TEMP/alphus-wheels"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/alphus-wheels" .
          python -m pip install --disable-pip-version-check --no-deps \
            --force-reinstall "$RUNNER_TEMP"/alphus-wheels/alphus-*.whl
      - name: Run Alphus quality profile
        run: |
          python -m alphus --root . --config quality-gates.toml \
            --run --profile check
