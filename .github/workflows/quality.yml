name: Alphus quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript profile tools
        run: npm ci
      - name: Test reusable JavaScript policy
        run: npm test
      - name: Check JavaScript lint, format, and types
        run: |
          npm run lint
          npm run format:check
          npm run format:markdown:check
          npm run typecheck

  self-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Alphus and run wheel self-check
        run: python scripts/ci.py --root . --wheel

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared dependency floors and run self-check
        run: python scripts/ci.py --root . --minimum
