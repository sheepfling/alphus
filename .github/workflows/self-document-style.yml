name: Alphus self document style review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Alphus
        run: python -m pip install --disable-pip-version-check -e '.[python]'
      - name: Review repository documentation
        shell: bash
        run: |
          set -o pipefail
          alphus --root . --config .github/alphus-document-style.toml \
            --profile self-document-style --output json \
            | tee "$RUNNER_TEMP/alphus-document-style.json"
      - name: Retain advisory findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alphus-document-style-review
          path: ${{ runner.temp }}/alphus-document-style.json
          if-no-files-found: ignore
          retention-days: 30
