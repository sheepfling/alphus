name: Alphus self quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript profile tools
        run: npm ci
      - name: Test reusable JavaScript policy
        run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check Alphus JavaScript orchestration profile
        run: |
          python -m pip install --disable-pip-version-check -e .
          alphus --profile javascript
      - name: Check JavaScript lint, format, and types
        run: |
          npm run lint
          npm run format:check
          npm run format:markdown:check
          npm run typecheck

  self-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Alphus and run wheel self-check
        run: >-
          python scripts/ci.py --root . --wheel
          --history-dir "${{ runner.temp }}/alphus-history"
          --consumer-id sheepfling/alphus
      - name: Retain verified profile history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alphus-history-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/alphus-history
          if-no-files-found: ignore
          retention-days: 90

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared dependency floors and run self-check
        run: python scripts/ci.py --root . --minimum

  optional-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: target-python
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v7
        id: checker-python
        with:
          python-version: "3.11"
      - name: Provision separate native checker and target environments
        shell: bash
        run: |
          "${{ steps.checker-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/alphus-checker"
          "${{ steps.target-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/alphus-target"
          "$RUNNER_TEMP/alphus-checker/bin/python" -m pip install --disable-pip-version-check -e '.[python,mypy,ty]'
          "$RUNNER_TEMP/alphus-target/bin/python" -m pip install --disable-pip-version-check 'snakemd==2.4.1' 'mdutils==1.8.1'
      - name: Verify optional typing checker extras
        run: |
          "$RUNNER_TEMP/alphus-checker/bin/python" -m mypy --version
          "$RUNNER_TEMP/alphus-checker/bin/python" -m ty --version
      - name: Install the optional FastAPI contract test extra
        run: >-
          "$RUNNER_TEMP/alphus-checker/bin/python" -m pip install
          --disable-pip-version-check -e '.[fastapi-test]'
      - name: Exercise optional Ty fixture checker
        shell: bash
        run: |
          fixtures="$RUNNER_TEMP/alphus-ty-fixtures"
          mkdir -p "$fixtures"
          printf '%s\n' 'value: int = 1' > "$fixtures/positive.py"
          printf '%s\n' 'value: int = "bad"  # expect-error' > "$fixtures/negative.py"
          "$RUNNER_TEMP/alphus-checker/bin/python" -m alphus.gates.stubs.typing_fixtures \
            --positive-fixture "$fixtures/positive.py" \
            --negative-fixture "$fixtures/negative.py" \
            --root "$fixtures" --checkers ty
      - name: Check Alphus JSON orchestration profile
        run: |
          "$RUNNER_TEMP/alphus-checker/bin/alphus" --profile json
      - name: Exercise optional gates and require no skipped cases
        shell: bash
        env:
          ALPHUS_TEST_CHECKER_PYTHON: ${{ runner.temp }}/alphus-checker/bin/python
          ALPHUS_TEST_TARGET_PYTHONS: ${{ runner.temp }}/alphus-target/bin/python
        run: |
          if ! output=$("$ALPHUS_TEST_CHECKER_PYTHON" -m pytest -q -rs \
            tests/gates/stubs/test_target_runtime_integration.py \
            tests/gates/python/test_module_roles_engine.py::test_module_role_rejects_symlinked_source_outside_root \
            tests/gates/source/test_script_policy_engine.py::test_cmd_router_rejects_a_symlinked_module_outside_the_root \
            tests/gates/cpp/test_cpp_quality.py::test_cpp_advisory_profile_runs_both_provisional_gates \
            tests/gates/review/test_scipy_constants_engine.py \
            tests/gates/review/frameworks/test_fastapi_contracts_engine.py \
            examples/consumer/fastapi/tests \
            tests/test_review_cli.py::test_scipy_direct_rule_uses_its_own_label 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          if [[ "$output" =~ [0-9]+[[:space:]]skipped ]]; then
            echo "Optional gate coverage skipped a selected test" >&2
            exit 1
          fi

  installed-stub-contract:
    name: installed stub contract (${{ matrix.os }}, Python ${{ matrix.target-python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-python: "3.10"
          - os: windows-latest
            target-python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: checker-python
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v7
        id: target-python
        with:
          python-version: ${{ matrix.target-python }}
      - name: Build and verify the installed three-checker example
        shell: bash
        run: |
          "${{ steps.checker-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/alphus-checker"
          "${{ steps.target-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/alphus-target"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            checker_python="$RUNNER_TEMP/alphus-checker/Scripts/python.exe"
            target_python="$RUNNER_TEMP/alphus-target/Scripts/python.exe"
          else
            checker_python="$RUNNER_TEMP/alphus-checker/bin/python"
            target_python="$RUNNER_TEMP/alphus-target/bin/python"
          fi
          "$checker_python" -m pip install --disable-pip-version-check \
            --index-url https://pypi.org/simple -e '.[python,mypy,ty]'
          "$target_python" -m pip install --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            'build>=1,<2' 'setuptools>=68' wheel 'mypy>=2.3,<3' \
            'typing_extensions>=4.12'
          "$checker_python" -m alphus.gates.stubs.verify \
            --root examples/stub-package-contract \
            --config stub-quality.json \
            --target-python "$target_python" \
            --report "$RUNNER_TEMP/stub-package-verification.json"
      - name: Retain installed-package verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stub-contract-${{ matrix.os }}-py${{ matrix.target-python }}
          path: ${{ runner.temp }}/stub-package-verification.json
          if-no-files-found: ignore
          retention-days: 30
