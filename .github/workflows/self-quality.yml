name: Alphus self quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript profile tools
        run: npm ci
      - name: Test reusable JavaScript policy
        run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check Alphus JavaScript orchestration profile
        run: |
          python -m pip install --disable-pip-version-check -e .
          alphus --profile javascript
      - name: Check JavaScript lint, format, and types
        run: |
          npm run lint
          npm run format:check
          npm run format:markdown:check
          npm run typecheck

  morphology-wheel-differential:
    name: Morphology pinned wheel differential
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/issue-87-morphology'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALPHUS_BASELINE: c880093f7ccb73c2af78ffb5c7de8c15d2b75b0e
      ALPHUS_CANDIDATE: ${{ github.event.pull_request.head.sha }}
      ALPHUS_REPORT_DIR: alphus-wheel-differential
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prepare differential evidence directory
        run: mkdir -p "$RUNNER_TEMP/$ALPHUS_REPORT_DIR"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install wheel build, test, Ruff, and JavaScript parser dependencies
        run: >-
          python -m pip install --disable-pip-version-check -e
          '.[python,javascript]'
          'setuptools>=80' 'setuptools-scm>=10.3.4,<11'
      - name: Verify exact comparison revisions
        id: verify-revisions
        run: |
          checked_out_commit="$(git rev-parse HEAD)"
          test "$checked_out_commit" = "$ALPHUS_CANDIDATE"
          git cat-file -e "$ALPHUS_BASELINE^{commit}"
          echo "checked_out_commit=$checked_out_commit" >> "$GITHUB_OUTPUT"
      - name: Compare pinned reference and candidate wheels
        id: wheel-differential
        continue-on-error: true
        run: |
          set +e
          python -m scripts.differential_wheels \
            --root . \
            --baseline "$ALPHUS_BASELINE" \
            --candidate "$ALPHUS_CANDIDATE" \
            --output "$RUNNER_TEMP/$ALPHUS_REPORT_DIR/harness-report.json" \
            >"$RUNNER_TEMP/$ALPHUS_REPORT_DIR/stdout.log" \
            2>"$RUNNER_TEMP/$ALPHUS_REPORT_DIR/stderr.log"
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -ne 0 ]; then
            cat "$RUNNER_TEMP/$ALPHUS_REPORT_DIR/stderr.log" >&2
            cat "$RUNNER_TEMP/$ALPHUS_REPORT_DIR/stdout.log" >&2
          fi
          exit "$result"
      - name: Retain comparison outcome and report provenance
        if: always()
        env:
          DIFFERENTIAL_OUTCOME: ${{ steps.wheel-differential.outcome }}
          DIFFERENTIAL_EXIT_CODE: ${{ steps.wheel-differential.outputs.exit_code }}
          VERIFIED_CHECKOUT: ${{ steps.verify-revisions.outputs.checked_out_commit }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import tomllib
          from pathlib import Path

          report_dir = Path(os.environ["RUNNER_TEMP"]) / os.environ["ALPHUS_REPORT_DIR"]
          harness_report = report_dir / "harness-report.json"
          stderr_log = report_dir / "stderr.log"
          manifest = Path("tests/differential/wheel-scenarios.toml")
          manifest_bytes = manifest.read_bytes()
          report: dict[str, object] | None = None
          result = "setup-failed"
          equivalent: bool | None = None
          coverage: dict[str, object] | None = None
          differences: list[object] | None = None
          scenario_classification: dict[str, object] | None = None
          if harness_report.is_file():
              try:
                  loaded_report = json.loads(harness_report.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  result = "invalid-report"
              else:
                  if not isinstance(loaded_report, dict):
                      result = "invalid-report"
                      loaded_report = None
                  if loaded_report is not None:
                      report = loaded_report
          if report is not None:
              report_manifest_sha256 = report.get("manifest_sha256")
              report_harness_sha256 = report.get("harness_sha256")
              raw_equivalent = report.get("equivalent_for_manifested_scenarios")
              if isinstance(raw_equivalent, bool):
                  equivalent = raw_equivalent
              reference = report.get("reference")
              candidate = report.get("candidate")
              if not isinstance(reference, dict) or not isinstance(candidate, dict):
                  result = "invalid-report"
              elif report_manifest_sha256 != hashlib.sha256(manifest_bytes).hexdigest():
                  result = "manifest-identity-mismatch"
              elif reference.get("commit") != os.environ["ALPHUS_BASELINE"]:
                  result = "baseline-identity-mismatch"
              elif candidate.get("commit") != os.environ["ALPHUS_CANDIDATE"]:
                  result = "candidate-identity-mismatch"
              elif report_harness_sha256 is None:
                  result = "missing-harness-identity"
              elif equivalent is True and os.environ["DIFFERENTIAL_EXIT_CODE"] == "0":
                  result = "equivalent-for-manifested-scenarios"
              elif equivalent is False:
                  result = "differences-found"
              else:
                  result = "comparison-failed"
              raw_coverage = report.get("coverage")
              if isinstance(raw_coverage, dict):
                  untested_selectors = raw_coverage.get(
                      "selectors_not_behaviorally_exercised"
                  )
                  planned_only_selectors = raw_coverage.get(
                      "selectors_in_plan_only_scenarios"
                  )
                  catalog_selector_count = raw_coverage.get("catalog_selector_count")
                  exercised_selectors = raw_coverage.get(
                      "behaviorally_exercised_selectors"
                  )
                  selector_coverage_complete = (
                      isinstance(catalog_selector_count, int)
                      and isinstance(exercised_selectors, list)
                      and len(exercised_selectors) == catalog_selector_count
                  )
                  coverage = {
                      "catalog_selector_count": catalog_selector_count,
                      "behaviorally_exercised_selector_count": (
                          len(exercised_selectors)
                          if isinstance(exercised_selectors, list)
                          else None
                      ),
                      "selectors_not_behaviorally_exercised": untested_selectors,
                      "selectors_in_plan_only_scenarios": planned_only_selectors,
                      "selector_coverage_complete": selector_coverage_complete,
                      "deferred_capabilities": raw_coverage.get("deferred_capabilities"),
                  }
              raw_differences = report.get("differences")
              if isinstance(raw_differences, list):
                  differences = raw_differences
              raw_classification = report.get("scenario_classification")
              if isinstance(raw_classification, dict):
                  scenario_classification = raw_classification
          elif result == "setup-failed" and os.environ["DIFFERENTIAL_OUTCOME"] == "failure":
              result = "failed-before-report"

          outcome = {
              "schema": "alphus-wheel-differential-job-v1",
              "result": result,
              "scenario_equivalence_scope": "manifested scenarios only",
              "equivalent_for_manifested_scenarios": (
                  result == "equivalent-for-manifested-scenarios"
              ),
              "harness_claimed_equivalent_for_manifested_scenarios": equivalent,
              "baseline_commit": os.environ["ALPHUS_BASELINE"],
              "candidate_commit": os.environ["ALPHUS_CANDIDATE"],
              "checked_out_commit": os.environ["VERIFIED_CHECKOUT"] or None,
              "manifest_sha256": hashlib.sha256(manifest_bytes).hexdigest(),
              "manifest_scenario_count": len(tomllib.loads(manifest_bytes.decode())["scenario"]),
              "behavioral_scenario_count": (
                  len(scenario_classification["behavioral"])
                  if scenario_classification is not None
                  and isinstance(scenario_classification.get("behavioral"), list)
                  else None
              ),
              "planned_only_scenario_count": (
                  len(scenario_classification["planned_only"])
                  if scenario_classification is not None
                  and isinstance(scenario_classification.get("planned_only"), list)
                  else None
              ),
              "harness_report": harness_report.name if report is not None else None,
              "harness_sha256": report.get("harness_sha256") if report is not None else None,
              "coverage": coverage,
              "differences": differences,
              "difference_count": len(differences) if differences is not None else None,
              "harness_exit_code": os.environ["DIFFERENTIAL_EXIT_CODE"] or None,
              "harness_step_outcome": os.environ["DIFFERENTIAL_OUTCOME"],
              "failure_stderr_tail": (
                  stderr_log.read_text(encoding="utf-8").splitlines()[-40:]
                  if stderr_log.is_file()
                  else []
              ),
          }
          if coverage is not None:
              selector_coverage_status = (
                  "complete"
                  if coverage["selector_coverage_complete"] is True
                  else "incomplete"
              )
          else:
              selector_coverage_status = "unavailable"
          outcome["selector_coverage_status"] = selector_coverage_status
          (report_dir / "job-status.json").write_text(
              json.dumps(outcome, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alphus-wheel-differential-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/alphus-wheel-differential/
          if-no-files-found: error
          retention-days: 90
      - name: Require a successful manifested-scenario comparison
        if: always()
        run: |
          python - "$RUNNER_TEMP/$ALPHUS_REPORT_DIR/job-status.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if status["result"] != "equivalent-for-manifested-scenarios":
              raise SystemExit(
                  "Pinned wheel differential did not complete successfully for "
                  f"the manifested scenarios: {status['result']}"
              )
          PY

  self-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Alphus and run wheel self-check
        run: >-
          python scripts/ci.py --root . --wheel
          --history-dir "${{ runner.temp }}/alphus-history"
          --consumer-id sheepfling/alphus
      - name: Install Python development tools for the suppression self-scan
        if: matrix.python-version == '3.11'
        run: python -m pip install --disable-pip-version-check -e '.[python]'
      - name: Audit Alphus source suppression reasons
        if: matrix.python-version == '3.11'
        run: >-
          alphus --root . --config examples/consumer/lint-suppressions.toml
          --profile suppression-review
      - name: Retain verified profile history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alphus-history-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/alphus-history
          if-no-files-found: ignore
          retention-days: 90

  source-archive-install:
    name: Install from a GitHub source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the versioning tool used to verify the archive
        run: python -m pip install --disable-pip-version-check "setuptools-scm>=10.3.4,<11"
      - name: Install Alphus from the same commit archive as reusable consumers
        shell: bash
        env:
          ALPHUS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          : "${ALPHUS_REF:?Provide a commit SHA for the Alphus archive}"
          expected_version="$(python -m setuptools_scm)"
          python -m pip install --disable-pip-version-check --no-deps \
            "alphus @ https://github.com/sheepfling/alphus/archive/${ALPHUS_REF}.zip"
          actual_version="$(python -c 'from importlib.metadata import version; print(version("alphus"))')"
          printf 'Git checkout: %s\nGitHub archive: %s\n' "$expected_version" "$actual_version"
          python - "$expected_version" "$actual_version" <<'PY'
          import sys
          from packaging.version import Version

          expected, actual = (Version(value).public for value in sys.argv[1:])
          if actual != expected:
              raise SystemExit(f"archive public version {actual} != checkout {expected}")
          PY

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared dependency floors and run self-check
        run: python scripts/ci.py --root . --minimum

  optional-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        id: target-python
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v7
        id: checker-python
        with:
          python-version: "3.11"
      - name: Provision separate native checker and target environments
        shell: bash
        run: |
          "${{ steps.checker-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/alphus-checker"
          "${{ steps.target-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/alphus-target"
          "$RUNNER_TEMP/alphus-checker/bin/python" -m pip install --disable-pip-version-check -e '.[python,mypy,ty,javascript]'
          "$RUNNER_TEMP/alphus-target/bin/python" -m pip install --disable-pip-version-check 'snakemd==2.4.1' 'mdutils==1.8.1'
      - name: Verify optional typing checker extras
        run: |
          "$RUNNER_TEMP/alphus-checker/bin/python" -m mypy --version
          "$RUNNER_TEMP/alphus-checker/bin/python" -m ty --version
      - name: Install the optional FastAPI contract test extra
        run: >-
          "$RUNNER_TEMP/alphus-checker/bin/python" -m pip install
          --disable-pip-version-check -e '.[fastapi-test]'
      - name: Install the optional PDF contract test extra
        run: >-
          "$RUNNER_TEMP/alphus-checker/bin/python" -m pip install
          --disable-pip-version-check -e '.[pdf]'
      - name: Exercise generated PDF navigation and portability contracts
        shell: bash
        env:
          ALPHUS_TEST_CHECKER_PYTHON: ${{ runner.temp }}/alphus-checker/bin/python
        run: |
          if ! output=$("$ALPHUS_TEST_CHECKER_PYTHON" -m pytest -q -rs \
            tests/execution/test_pdf_navigation_contract.py \
            tests/execution/test_pdf_portability_contract.py 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          if [[ "$output" =~ [0-9]+[[:space:]]skipped ]]; then
            echo "PDF contract coverage skipped a selected test" >&2
            exit 1
          fi
      - name: Exercise optional Ty fixture checker
        shell: bash
        run: |
          fixtures="$RUNNER_TEMP/alphus-ty-fixtures"
          mkdir -p "$fixtures"
          printf '%s\n' 'value: int = 1' > "$fixtures/positive.py"
          printf '%s\n' 'value: int = "bad"  # expect-error' > "$fixtures/negative.py"
          "$RUNNER_TEMP/alphus-checker/bin/python" -m alphus.gates.stubs.typing_fixtures \
            --positive-fixture "$fixtures/positive.py" \
            --negative-fixture "$fixtures/negative.py" \
            --root "$fixtures" --checkers ty
      - name: Check Alphus JSON orchestration profile
        run: |
          "$RUNNER_TEMP/alphus-checker/bin/alphus" --profile json
      - name: Exercise optional gates and require no skipped cases
        shell: bash
        env:
          ALPHUS_TEST_CHECKER_PYTHON: ${{ runner.temp }}/alphus-checker/bin/python
          ALPHUS_TEST_TARGET_PYTHONS: ${{ runner.temp }}/alphus-target/bin/python
        run: |
          if ! output=$("$ALPHUS_TEST_CHECKER_PYTHON" -m pytest -q -rs \
            tests/gates/stubs/test_target_runtime_integration.py \
            tests/gates/python/test_module_roles_engine.py::test_module_role_rejects_symlinked_source_outside_root \
            tests/gates/source/test_script_policy_engine.py::test_cmd_router_rejects_a_symlinked_module_outside_the_root \
            tests/gates/cpp/test_cpp_quality.py::test_cpp_advisory_profile_runs_both_provisional_gates \
            tests/gates/review/test_scipy_constants_engine.py \
            tests/gates/review/frameworks/test_fastapi_contracts_engine.py \
            examples/consumer/fastapi/tests \
            tests/test_review_cli.py::test_numeric_direct_rule_uses_its_feature_label 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          if [[ "$output" =~ [0-9]+[[:space:]]skipped ]]; then
            echo "Optional gate coverage skipped a selected test" >&2
            exit 1
          fi

  installed-stub-contract:
    name: installed stub contract (${{ matrix.os }}, Python ${{ matrix.target-python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-python: "3.10"
          - os: ubuntu-latest
            target-python: "3.11"
          - os: ubuntu-latest
            target-python: "3.12"
          - os: ubuntu-latest
            target-python: "3.13"
          - os: windows-latest
            target-python: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        id: checker-python
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v7
        id: target-python
        with:
          python-version: ${{ matrix.target-python }}
      - name: Build and verify the installed three-checker example
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          "${{ steps.checker-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/alphus-checker"
          "${{ steps.target-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/alphus-target"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            checker_python="$RUNNER_TEMP/alphus-checker/Scripts/python.exe"
            target_python="$RUNNER_TEMP/alphus-target/Scripts/python.exe"
          else
            checker_python="$RUNNER_TEMP/alphus-checker/bin/python"
            target_python="$RUNNER_TEMP/alphus-target/bin/python"
          fi
          "$checker_python" -m pip install --disable-pip-version-check \
            --index-url https://pypi.org/simple -e '.[python,mypy,ty]'
          "$target_python" -m pip install --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            'build>=1,<2' 'setuptools>=68' wheel 'mypy>=2.3,<3' \
            'typing_extensions>=4.12'
          "$checker_python" -m alphus.gates.stubs.verify \
            --root examples/stub-package-contract \
            --config stub-quality.json \
            --target-python "$target_python" \
            --report "$RUNNER_TEMP/stub-package-verification.json"
      - name: Retain installed-package verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stub-contract-${{ matrix.os }}-py${{ matrix.target-python }}
          path: ${{ runner.temp }}/stub-package-verification.json
          if-no-files-found: ignore
          retention-days: 30

  mdutils-stub-consumer-trial:
    name: pinned mdutils stub consumer trial (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: sheepfling/mdutils-stubs
          ref: 777b4b600e128721493999ed48867fa664f1a573
          path: mdutils-stubs-source
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: checker-python
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v7
        id: target-python
        with:
          python-version: "3.11"
      - name: Provision isolated checker and target environments
        shell: bash
        run: |
          "${{ steps.checker-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/mdutils-checker"
          "${{ steps.target-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/mdutils-target"
          "$RUNNER_TEMP/mdutils-checker/bin/python" -m pip install \
            --disable-pip-version-check --index-url https://pypi.org/simple \
            -e '.[python,mypy,ty]' \
            'mypy==2.4.1' 'pyright==1.1.414' 'ty==0.0.91'
          "$RUNNER_TEMP/mdutils-target/bin/python" -m pip install \
            --disable-pip-version-check --index-url https://pypi.org/simple \
            'build>=1.2,<2' 'setuptools>=80' 'setuptools-scm>=9.2,<10' \
            wheel 'mypy==2.4.1' 'mdutils==1.8.1'
      - name: Create a calibrated copy of the pinned consumer checkout
        shell: bash
        run: |
          cp -a mdutils-stubs-source "$RUNNER_TEMP/mdutils-stubs-calibrated"
          "$RUNNER_TEMP/mdutils-checker/bin/python" \
            scripts/prepare_mdutils_stub_trial.py \
            --consumer-root "$RUNNER_TEMP/mdutils-stubs-calibrated"
      - name: Run the pinned installed consumer recipe
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          SETUPTOOLS_SCM_PRETEND_VERSION: 1.8.1.0
        run: |
          "$RUNNER_TEMP/mdutils-checker/bin/python" -m alphus.gates.stubs.verify \
            --root "$RUNNER_TEMP/mdutils-stubs-calibrated" \
            --config stub-quality.json \
            --target-python "$RUNNER_TEMP/mdutils-target/bin/python" \
            --report "$RUNNER_TEMP/mdutils-stub-consumer-report.json"
      - name: Preserve the unmodified Ty class-object limitation
        shell: bash
        run: |
          fixtures="$RUNNER_TEMP/mdutils-stubs-calibrated/tests/fixtures"
          log="$RUNNER_TEMP/mdutils-stub-unmodified-ty.log"
          if "$RUNNER_TEMP/mdutils-checker/bin/python" \
            -m alphus.gates.stubs.typing_fixtures \
            --positive-fixture "$fixtures/positive.py" \
            --negative-fixture "$fixtures/negative_calibrated.py" \
            --root "$RUNNER_TEMP/mdutils-stubs-calibrated" \
            --checkers ty \
            --target-python "$RUNNER_TEMP/mdutils-target/bin/python" \
            --python-version 3.11 >"$log" 2>&1; then
            echo "The recorded Ty limitation unexpectedly disappeared; review and update the calibration." >&2
            cat "$log"
            exit 1
          fi
          if ! grep -Fq 'assert-type-unspellable-subtype' "$log"; then
            echo "Ty failed for a reason other than the recorded class-object assertion limitation." >&2
            cat "$log"
            exit 1
          fi
      - name: Retain consumer verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mdutils-stub-consumer-python-3.11
          path: |
            ${{ runner.temp }}/mdutils-stub-consumer-report.json
            ${{ runner.temp }}/mdutils-stub-unmodified-ty.log
          if-no-files-found: ignore
          retention-days: 90
  pdf-native-toolchain-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install native PDF and LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qpdf latexmk texlive-latex-recommended
      - name: Install the optional PDF checker dependency
        run: python -m pip install --disable-pip-version-check -e '.[pdf]'
      - name: Run the generated LaTeX and PDF consumer profile
        run: |
          latexmk -v
          qpdf --version
          alphus --root . --config examples/documents/pdf-structural-check.toml \
            --run --profile pdf-structure
      - name: Retain the generated PDF and final build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-native-toolchain-smoke
          path: |
            build/report.pdf
            build/report.log
            build/report.aux
          if-no-files-found: ignore
          retention-days: 7
