schema_version = 1

[files]
include = ["src/numerics/*.py", "src/geometry/*.py"]
exclude = []

[checks.manual_matrix_kernels]
extensions = [".py"]
exclude = []
source_paths = ["src/numerics/*.py"]

[checks.array_representation_churn]
extensions = [".py"]
exclude = []
source_paths = ["src/numerics/*.py"]
array_constructors = ["numpy.asarray", "np.asarray"]
list_conversion_methods = ["tolist"]

[[checks.array_representation_churn.loop_contracts]]
path = "src/numerics/kernels.py"
function = "process_batches"
array_variable = "batch"

[checks.cholesky_recurrence]
extensions = [".py"]
exclude = []
source_paths = ["src/numerics/*.py"]
square_root_helpers = ["math.sqrt"]

[checks.manual_quaternion_products]
extensions = [".py"]
exclude = []
source_paths = ["src/geometry/*.py"]
function_names = ["multiply_quaternions"]
left_components = ["lw", "lx", "ly", "lz"]
right_components = ["rw", "rx", "ry", "rz"]
result_components = ["ow", "ox", "oy", "oz"]

[checks.manual_quaternion_conjugation]
extensions = [".py"]
exclude = []
source_paths = ["src/geometry/*.py"]
function_names = ["conjugate_quaternion"]
components = ["w", "x", "y", "z"]

[orchestration]
default_profile = "numerical-review"

[[orchestration.steps]]
kind = "rule"
name = "Manual matrix kernels"
rule = "manual-matrix-kernels"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Array representation churn"
rule = "array-representation-churn"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Cholesky recurrence review"
rule = "cholesky-recurrence"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Quaternion product review"
rule = "manual-quaternion-products"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Quaternion conjugation review"
rule = "manual-quaternion-conjugation"
rollout = "provisional"

[[orchestration.profiles]]
name = "numerical-review"
steps = ["Manual matrix kernels", "Array representation churn", "Cholesky recurrence review", "Quaternion product review", "Quaternion conjugation review"]
