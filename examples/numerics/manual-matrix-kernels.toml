schema_version = 1

[files]
include = ["src/numerics/*.py"]
exclude = []

[checks.manual_matrix_kernels]
extensions = [".py"]
exclude = []
source_paths = ["src/numerics/*.py"]

[checks.array_representation_churn]
extensions = [".py"]
exclude = []
source_paths = ["src/numerics/*.py"]
array_constructors = ["numpy.asarray", "np.asarray"]
list_conversion_methods = ["tolist"]

[checks.cholesky_recurrence]
extensions = [".py"]
exclude = []
source_paths = ["src/numerics/*.py"]
square_root_helpers = ["math.sqrt"]

[orchestration]
default_profile = "numerical-review"

[[orchestration.steps]]
kind = "rule"
name = "Manual matrix kernels"
rule = "manual-matrix-kernels"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Array representation churn"
rule = "array-representation-churn"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Cholesky recurrence review"
rule = "cholesky-recurrence"
rollout = "provisional"

[[orchestration.profiles]]
name = "numerical-review"
steps = ["Manual matrix kernels", "Array representation churn", "Cholesky recurrence review"]
