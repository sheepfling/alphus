schema_version = 1

[files]
include = ["orchestrate.py"]
exclude = []

[checks.environment_boundary]
enabled = true
severity = "info"
exclude = []

[[checks.environment_boundary.contracts]]
name = "private-report"
setting = "ALPHUS_SYNTHETIC_REPORT"
source_path = "orchestrate.py"
function = "orchestrate"

[[checks.environment_boundary.contracts.children]]
name = "report"
argv = ["tool", "report"]
allow_setting = true

[[checks.environment_boundary.contracts.children]]
name = "tests"
argv = ["tool", "test"]
allow_setting = false

[orchestration]
default_profile = "environment-review"
failure_threshold = "warning"

[[orchestration.steps]]
kind = "rule"
name = "Environment boundary review"
rule = "environment-boundary"
rollout = "provisional"

[[orchestration.profiles]]
name = "environment-review"
steps = ["Environment boundary review"]
