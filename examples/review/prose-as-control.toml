schema_version = 1

[files]
include = ["src/render/*.py"]
exclude = []

[checks.prose_as_control]
extensions = [".py"]
exclude = []
source_paths = ["src/render/*.py"]
minimum_characters = 60
minimum_words = 8
allowed_literals = ["The remote peer reports a state transition that this client does not handle."]
lossy_text_rewrite = true
regex_sub_helpers = ["re.sub"]
rendered_value_helpers = ["render_latex"]

[checks.positional_semantic_overrides]
extensions = [".py"]
exclude = []
source_paths = ["src/render/*.py"]
position_variables = ["row_number", "page_number"]
semantic_fields = ["Interpretation", "Content"]
minimum_override_characters = 40

[checks.unexplained_empty_results]
extensions = [".py"]
exclude = []
source_paths = ["src/render/*.py"]
nonempty_inputs = ["records"]
unavailable_flags = ["inferred_schema"]

[checks.embedded_semantic_overrides]
extensions = [".py"]
exclude = []
source_paths = ["src/render/*.py"]
replacement_maps = ["fixed_paragraphs"]
source_anchor_helpers = ["source_anchor"]

[orchestration]
default_profile = "semantic-review"

[[orchestration.steps]]
kind = "rule"
name = "Prose branch review"
rule = "prose-as-control"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Rendered value feedback review"
rule = "rendered-value-reparsed"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Positional semantic override review"
rule = "positional-semantic-overrides"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Unknown inference empty-result review"
rule = "unexplained-empty-results"
rollout = "provisional"

[[orchestration.steps]]
kind = "rule"
name = "Embedded semantic replacement review"
rule = "embedded-semantic-overrides"
rollout = "provisional"

[[orchestration.profiles]]
name = "semantic-review"
steps = ["Prose branch review", "Rendered value feedback review", "Positional semantic override review", "Unknown inference empty-result review", "Embedded semantic replacement review"]
