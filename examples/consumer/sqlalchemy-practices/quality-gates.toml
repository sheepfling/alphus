schema_version = 1

[files]
include = ["src/**/*.py"]
exclude = []

[checks.sqlalchemy_practices]
target_sqlalchemy = ">=2.0,<3.0"
extensions = [".py"]
exclude = []
report_legacy_query = true
report_legacy_declarative_base = true
report_backref = true
report_literal_execute = true
report_module_session = true
report_repository_commit = false
repository_paths = []

[orchestration]
default_profile = "check"
failure_threshold = "error"

[[orchestration.steps]]
kind = "rule"
name = "SQLAlchemy practices"
rule = "sqlalchemy-practices"
rollout = "provisional"

[[orchestration.profiles]]
name = "check"
steps = ["SQLAlchemy practices"]
