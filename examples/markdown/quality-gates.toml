schema_version = 1

[files]
include = ["*.md", "**/*.md"]
exclude = []

[orchestration]
default_profile = "check"

[[orchestration.steps]]
kind = "command"
name = "Markdown links and graph"
argv = ["{python}", "-m", "mdrepo", "--root", "{root}", "check", "--summary"]

[[orchestration.steps]]
kind = "command"
name = "Markdown style"
argv = ["rumdl", "check", "{files}"]
fix_argv = ["rumdl", "fmt", "{files}"]

[orchestration.steps.files]
include = ["*.md", "**/*.md"]
exclude = []

[[orchestration.profiles]]
name = "markdown"
steps = ["Markdown links and graph", "Markdown style"]

[[orchestration.profiles]]
name = "check"
includes = ["markdown"]
