[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphus"
version = "0.1.0"
description = "Portable, policy-driven source quality gates for Git repositories"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "packaging>=23,<27",
  "pydantic>=2.7,<3",
  "rich>=15.0.0,<16",
  "typer>=0.27.3,<0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.16,<1",
]

[project.scripts]
alphus = "alphus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "ci/stub-quality/python"]

[tool.ruff.lint.isort]
known-first-party = ["alphus", "alphus_stub_quality"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.setuptools.package-data]
alphus = ["py.typed"]
