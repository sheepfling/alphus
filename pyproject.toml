[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10.3.4,<11"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "alphus"
dynamic = ["version", "entry-points"]
description = "Portable, policy-driven source quality gates for Git repositories"
requires-python = ">=3.11,<3.16"
readme = "README.md"
dependencies = [
  "markdown-it-py>=4,<5",
  "packaging>=23,<27",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich>=15.0.0,<16",
  "SQLAlchemy>=2.0.52,<2.2",
  "typer>=0.27.3,<0.28",
]

[project.optional-dependencies]
python = [
  "markdown-it-py>=4.2,<5",
  "pyright>=1.1.414,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<1",
  "types-PyYAML>=6,<7",
]
mypy = ["mypy>=2.3,<3"]
ty = ["ty==0.0.91"]
cyclomatic-lizard = ["lizard==1.24.2"]
fastapi-test = ["fastapi>=0.115,<1", "httpx>=0.27,<1"]
pdf = ["pypdf>=5,<7"]
javascript = [
  "tree-sitter>=0.25.1,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
]

[project.scripts]
alphus = "alphus.cli:main"
alphus-history = "alphus.execution.history_cli:main"
alphus-typing-fixtures = "alphus.gates.stubs.typing_fixtures:main"
alphus-stub-quality = "alphus.gates.stubs.verify:main"
alphus-cpp-quality = "alphus.gates.cpp.cpp_common_quality:main"
alphus-cpp-advisory-quality = "alphus.gates.cpp.cpp_advisory_quality:main"
alphus-cpp-artifact-quality = "alphus.gates.cpp.cpp_artifact_quality:main"
alphus-worktree-hygiene = "alphus.gates.vcs.worktree_hygiene:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.setuptools_scm.scm.git]
pre_parse = "fail_on_shallow"

[tool.setuptools.dynamic]
entry-points = {file = ".registry-build/entry_points.txt"}

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["alphus", "alphus_stub_quality"]

[tool.pyright]
include = ["src", "scripts"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.setuptools.package-data]
alphus = ["py.typed", "*.pyi"]
alphus_stub_quality = ["py.typed"]
