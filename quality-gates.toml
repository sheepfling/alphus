schema_version = 1

[files]
include = [
  "src/**/*.py", "tests/**/*.py", "README.md", "docs/**/*.md",
  "examples/**/*.toml", "pyproject.toml", "quality-gates.toml",
]
exclude = []

[checks.file_size]
code_extensions = [".py"]
code_limit = 3000
hard_limit = 5000
initializer_name = "__init__.py"
initializer_limit = 100
exclude = []

[checks.line_length]
exclude = []

[checks.line_length.limits]
".py" = 100
".md" = 120

[checks.json_structure]
extensions = [".py"]
exclude = ["tests/**"]

[checks.output_escaping]
extensions = [".py"]
exclude = []

[checks.path_discovery]
extensions = [".py"]
exclude = []
inspection_exclude = ["tests/**"]

[checks.python_style]
extensions = [".py"]
exclude = []
opaque_boundary_paths = []
opaque_boundary_marker_prefix = "# opaque-boundary: "
opaque_boundary_min_reason_chars = 12
forbidden_main_imports = ["main"]

[checks.runtime_types]
extensions = [".py"]
exclude = [
  "tests/**",
  "src/alphus/python_style.py",
  "src/alphus/runtime_types.py",
]

[checks.numeric_literals]
extensions = [".py"]
exclude = []
math_constants = true

[checks.test_quality]
extensions = [".py"]
exclude = []
test_paths = ["tests/**"]
ephemeral_document_patterns = []

[checks.input_contracts]
extensions = [".py"]
exclude = []

[checks.package_boundaries]
metadata_patterns = ["pyproject.toml"]
source_directory = "src"
local_dependency_prefixes = ["alphus"]
loose_module_directories = []
forbidden_import_roots = ["src", "tests"]
vendor_path_components = ["vendor"]
file_loader_calls = ["spec_from_file_location", "SourceFileLoader", "run_path"]
reject_sys_path_mutations = true
reject_dynamic_imports = true
require_import_packages = true

[checks.package_boundaries.allowed_dependencies]
alphus = []
alphus_stub_quality = []

[orchestration]
default_profile = "check"

[[orchestration.steps]]
kind = "rule"
name = "Package boundaries"
rule = "package-boundaries"

[[orchestration.steps]]
kind = "rule"
name = "Python structure"
rule = "python-style"

[[orchestration.steps]]
kind = "rule"
name = "Runtime type usage"
rule = "runtime-types"

[[orchestration.steps]]
kind = "rule"
name = "JSON structure"
rule = "json-structure"

[[orchestration.steps]]
kind = "rule"
name = "Output escaping"
rule = "output-escaping"

[[orchestration.steps]]
kind = "rule"
name = "Path handling"
rule = "path-discovery"

[[orchestration.steps]]
kind = "rule"
name = "Line length"
rule = "line-length"

[[orchestration.steps]]
kind = "rule"
name = "File size"
rule = "file-size"

[[orchestration.steps]]
kind = "command"
name = "Python lint"
argv = [
  "{python}", "-m", "ruff", "check", "src", "tests", "--select",
  "E4,E7,E9,F,ANN,I",
]

[[orchestration.steps]]
kind = "command"
name = "Package tests"
argv = [
  "{python}", "-m", "pytest", "-p", "no:cacheprovider", "tests", "-q",
]

[[orchestration.profiles]]
name = "python-policy"
steps = [
  "Package boundaries", "Python structure", "Runtime type usage",
  "JSON structure", "Output escaping", "Path handling", "Line length",
  "File size",
]

[[orchestration.profiles]]
name = "python"
steps = ["Python lint", "Package tests"]

[[orchestration.profiles]]
name = "check"
includes = ["python-policy", "python"]

[[orchestration.steps]]
kind = "rule"
name = "Numeric review"
rule = "numeric-literals"

[[orchestration.steps]]
kind = "rule"
name = "Test review"
rule = "test-quality"

[[orchestration.steps]]
kind = "rule"
name = "Input contract review"
rule = "input-contracts"

[[orchestration.profiles]]
name = "review"
steps = ["Numeric review", "Test review", "Input contract review"]
