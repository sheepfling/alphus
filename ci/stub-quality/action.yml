name: Stub package verification
description: Build a stub package and verify its installed consumer surface.
inputs:
  python-version:
    description: Python 3.11 or later used by the verification environment.
    required: false
    default: "3.12"
  requirements-file:
    description: Runtime compatibility requirements file in the caller repository.
    required: true
  config-file:
    description: Stub-specific verification settings JSON file.
    required: false
    default: stub-quality.json
  with-twine:
    description: Also validate wheel and sdist metadata with Twine.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          ${{ inputs.requirements-file }}
    - name: Install runtime and shared verification tools
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        WITH_TWINE: ${{ inputs.with-twine }}
        ALPHUS_ROOT: ${{ github.action_path }}/../..
      run: |
        python -m pip install --disable-pip-version-check "$ALPHUS_ROOT" -r "$REQUIREMENTS_FILE" \
          "build>=1.2" "mypy>=2.3" "pyright>=1.1.414" \
          "setuptools>=80" "setuptools-scm>=9.2" "pydantic>=2.7,<3" wheel
        if [[ "$WITH_TWINE" == "true" ]]; then
          python -m pip install --disable-pip-version-check "twine>=7.0"
        fi
    - name: Build and verify installed stub package
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        WITH_TWINE: ${{ inputs.with-twine }}
      run: |
        args=(--root "$GITHUB_WORKSPACE" --config "$CONFIG_FILE")
        if [[ "$WITH_TWINE" == "true" ]]; then
          args+=(--with-twine)
        fi
        python -m alphus_stub_quality.verify "${args[@]}"
